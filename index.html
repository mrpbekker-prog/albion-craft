<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор крафта — Albion Online</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151c">

<style>
  :root{
    --bg:#12151c; --card:#1a1f2b; --card2:#202634; --line:#2b3345;
    --text:#dfe6f0; --muted:#8b95a8; --accent:#c9d3e0;
    --green:#3ec46d; --red:#e05252; --gold:#e8c25a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:15px}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
  .card h2{font-size:18px;margin:0 0 14px;color:var(--gold)}
  .card h3{font-size:15px;margin:18px 0 10px;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  select,input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:14px;outline:none}
  input:focus,select:focus{border-color:#4a5a78}
  button{padding:9px 16px;border-radius:8px;border:none;background:#2c3550;color:var(--text);
    cursor:pointer;font-size:14px;white-space:nowrap}
  button:hover{background:#3a4666}
  .btn-danger{background:#3a2530}
  .btn-danger:hover{background:#522f3c}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th{color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 6px;border-bottom:1px solid #232a3a;vertical-align:middle}
  td input{padding:5px 8px;min-width:64px}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px;color:#10131a}
  .empty{color:var(--muted);padding:10px 0;font-style:italic}
  .del{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;line-height:1}
  .del:hover{color:var(--red)}
  .buy{color:var(--red);font-weight:700;cursor:pointer;text-decoration:underline dotted}
  .buy:hover{color:#ff7b7b}
  .ok-note{color:var(--muted);font-size:12px}
  .rest-ok{color:var(--green);font-weight:700}
  .rest-bad{color:var(--red);font-weight:700}
  .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
  .res{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .res .t{font-size:12px;color:var(--muted);margin-bottom:6px}
  .res .v{font-size:19px;font-weight:700}
  .res .v.green{color:var(--green)} .res .v.red{color:var(--red)}
  .itemline{font-size:16px;font-weight:700;margin-bottom:12px}
  .pos-badge{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:800;font-size:13px;color:#10131a;margin-left:6px;vertical-align:middle}
  .ench-badge{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:800;font-size:13px;color:#fff;background:#d97b2b;margin-left:6px;vertical-align:middle}
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;margin:0}
  .chk input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
  .craftbar{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .btn-craft{background:var(--gold);color:#10131a;font-weight:700;padding:11px 28px;font-size:15px}
  .btn-craft:hover{background:#f2d27a}
  .craft-msg{font-size:13px}
  .craft-msg.ok{color:var(--green)}
  .craft-msg.bad{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Калькулятор крафта</h1>
  <div class="sub">Albion Online · Блок 1 — Склад · Блок 2 — Крафт</div>

  <div class="card" id="card-warehouse">
    <h2>Блок 1 · Склад</h2>
    <div class="grid">
      <div><label>Ресурс</label><select id="wh-type"></select></div>
      <div><label>Тир</label><select id="wh-tier"></select></div>
      <div><label>Зачарование</label><select id="wh-ench"></select></div>
      <div><label>Количество</label><input id="wh-qty" type="number" min="0" step="1" value="0"></div>
      <div><label>Цена за 1 предмет (сер.)</label><input id="wh-price" type="number" min="0" step="any" value="0"></div>
      <div><button id="wh-add">Добавить</button></div>
    </div>
    <div id="wh-table"></div>
    <div style="margin-top:12px"><button class="btn-danger" id="wh-clear">Очистить склад</button></div>
  </div>

  <div class="card" id="card-craft">
    <h2>Блок 2 · Крафт</h2>
    <div class="grid">
      <div><label>Название предмета</label><input id="it-name" type="text" placeholder="Например: Огненный посох"></div>
      <div><label>Тир предмета</label><select id="it-tier"></select></div>
      <div><label>Зачарование предмета</label><select id="it-ench"></select></div>
    </div>

    <h3>Ресурсы для создания</h3>
    <div class="grid">
      <div><label>Тип ресурса</label><select id="cr-type"></select></div>
      <div><label>Тир ресурса</label><select id="cr-tier"></select></div>
      <div><label>Зачарование</label><select id="cr-ench"></select></div>
      <div><label>Кол-во на 1 шт.</label><input id="cr-qty" type="number" min="1" step="1" value="1"></div>
      <div><label>Цена (для артефакта / если нет на складе)</label><input id="cr-price" type="number" min="0" step="any" placeholder="0"></div>
      <div><button id="cr-add">Добавить ресурс</button></div>
    </div>
    <div id="cr-table"></div>

    <div class="settings">
      <div><label>Возврат ресурсов, %</label><input id="set-return" type="number" min="0" max="100" step="0.1" value="0"></div>
      <div><label>Крафт, сер. за 1 шт.</label><input id="set-fee" type="number" min="0" step="any" value="0"></div>
      <div><label>Кол-во предметов</label><input id="set-qty" type="number" min="1" step="1" value="1"></div>
      <div><label>Цена продажи (сер. за 1 шт.)</label><input id="set-sell" type="number" min="0" step="any" value="0"></div>
    </div>
    <div class="settings" style="margin-top:10px">
      <div><label class="chk"><input type="checkbox" id="set-premium"> Премиум — налог 4%</label></div>
      <div><label class="chk"><input type="checkbox" id="set-order"> Ордер — +2,5% к налогу</label></div>
    </div>

    <div class="results" id="results"></div>

    <div class="craftbar">
      <button id="do-craft" class="btn-craft">Крафт</button>
      <span id="craft-msg" class="craft-msg"></span>
    </div>
  </div>
</div>

<script>
const RES_TYPES = ['Слиток','Кожа','Ткань','Брусья','Артефакт'];
const TIER_COLORS = {4:'#4a8fe0',5:'#e05252',6:'#e0a63a',7:'#a86ae0',8:'#f0c040'};
let warehouse = [];   // {type,tier,ench,qty,price}
let craft = [];       // {type,tier,ench,perItem,price}

const $ = id => document.getElementById(id);
const fmt = n => (Math.floor(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fmt1 = n => (Math.floor(n*10)/10).toLocaleString('ru-RU',{maximumFractionDigits:1});
const enchLabel = e => e===0 ? 'нет' : '.'+e;

function fillSelect(sel, arr, labels){
  sel.innerHTML = '';
  arr.forEach((v,i)=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = labels ? labels[i] : v;
    sel.appendChild(o);
  });
}
function tierBadge(t){
  return '<span class="badge" style="background:'+TIER_COLORS[t]+'">T'+t+'</span>';
}
function enchBadge(e){
  return e===0 ? '' : '<span class="ench-badge">.'+e+'</span>';
}
function resName(r){
  return r.type+' '+tierBadge(r.tier)+(r.ench?enchBadge(r.ench):'');
}

/* ---------- Склад ---------- */
function renderWarehouse(){
  const box = $('wh-table');
  if(!warehouse.length){ box.innerHTML = '<div class="empty">Склад пуст — добавьте ресурсы выше.</div>'; return; }
  let h = '<table><thead><tr><th>Ресурс</th><th>Тир</th><th>Зач.</th><th>Кол-во</th><th>Цена за 1 шт.</th><th></th></tr></thead><tbody>';
  warehouse.forEach((w,i)=>{
    h += '<tr><td>'+w.type+'</td>'
      + '<td>'+tierBadge(w.tier)+'</td>'
      + '<td>'+(w.ench?enchBadge(w.ench):'<span class="ok-note">нет</span>')+'</td>'
      + '<td><input type="number" min="0" step="1" value="'+w.qty+'" onchange="setWhQty('+i+',this.value)"></td>'
      + '<td><input type="number" min="0" step="any" value="'+w.price+'" onchange="setWhPrice('+i+',this.value)"></td>'
      + '<td><button class="del" title="Удалить" onclick="delWh('+i+')">✕</button></td></tr>';
  });
  h += '</tbody></table>';
  box.innerHTML = h;
}
function setWhQty(i,v){ warehouse[i].qty = Math.max(0, Number(v)||0); recalc(); }
function setWhPrice(i,v){ warehouse[i].price = Math.max(0, Number(v)||0); recalc(); }
function delWh(i){ warehouse.splice(i,1); renderWarehouse(); recalc(); }

$('wh-add').onclick = () => {
  const item = { type:$('wh-type').value, tier:+$('wh-tier').value, ench:+$('wh-ench').value,
                 qty:Math.max(0, Number($('wh-qty').value)||0), price:Math.max(0, Number($('wh-price').value)||0) };
  const same = warehouse.find(w => w.type===item.type && w.tier===item.tier && w.ench===item.ench);
  if(same){ same.qty += item.qty; same.price = item.price; }
  else warehouse.push(item);
  $('wh-qty').value = 0;
  renderWarehouse(); recalc();
};
$('wh-clear').onclick = () => { warehouse = []; renderWarehouse(); recalc(); };

/* ---------- Крафт: ресурсы ---------- */
function renderCraft(){
  const box = $('cr-table');
  if(!craft.length){ box.innerHTML = '<div class="empty">Ресурсы не добавлены.</div>'; return; }
  let h = '<table><thead><tr><th>Ресурс</th><th>На 1 шт.</th><th>Всего на партию</th><th>Израсходуется (с возвратом)</th><th>Цена</th><th>Стоимость</th><th>Остаток после крафта</th><th></th></tr></thead><tbody>';
  craft.forEach((r,i)=>{
    const art = r.type==='Артефакт';
    const wq = findWarehouse(r);
    const total = r.perItem * batchQty();
    const consumed = art ? total : (batchQty() ? Math.ceil(total * (1 - returnRate()/100)) : 0);
    const priceCell = art || wq===null
      ? '<input type="number" min="0" step="any" value="'+r.price+'" onchange="setCrPrice('+i+',this.value)">'
      : '<span class="ok-note">'+fmt(wq.price)+' (склад)</span>';
    const wQty = wq ? wq.qty : 0;
    let restCell;
    if(art){ restCell = '<span class="ok-note">—</span>'; }
    else{
      const rest = wQty - consumed;
      if(rest > 0) restCell = '<span class="rest-ok">'+fmt(rest)+'</span>';
      else{
        const need = Math.max(consumed - wQty, 0);
        restCell = '<span class="rest-bad">0</span> <span class="buy" title="Добавить на склад" onclick="buyResource('+i+')">Докупить: '+fmt(need)+' шт.</span>';
      }
    }
    const cost = consumed * (art || wq===null ? r.price : wq.price);
    h += '<tr><td>'+resName(r)+'</td>'
      + '<td>'+fmt(r.perItem)+'</td>'
      + '<td>'+fmt(total)+'</td>'
      + '<td>'+fmt(consumed)+'</td>'
      + '<td>'+priceCell+'</td>'
      + '<td>'+fmt(cost)+'</td>'
      + '<td>'+restCell+'</td>'
      + '<td><button class="del" title="Удалить" onclick="delCr('+i+')">✕</button></td></tr>';
  });
  h += '</tbody></table>';
  box.innerHTML = h;
}
function setCrPrice(i,v){ craft[i].price = Math.max(0, Number(v)||0); recalc(); }
function delCr(i){ craft.splice(i,1); renderCraft(); recalc(); }

$('cr-add').onclick = () => {
  craft.push({ type:$('cr-type').value, tier:+$('cr-tier').value, ench:+$('cr-ench').value,
               perItem:Math.max(1, Number($('cr-qty').value)||1), price:Math.max(0, Number($('cr-price').value)||0) });
  $('cr-price').value = '';
  renderCraft(); recalc();
};

function findWarehouse(r){
  const rows = warehouse.filter(w => w.type===r.type && w.tier===r.tier && w.ench===r.ench);
  if(!rows.length) return null;
  const withQty = rows.filter(w => w.qty > 0);
  if(withQty.length){
    const tq = withQty.reduce((s,w)=>s+w.qty,0);
    return { qty:tq, price: withQty.reduce((s,w)=>s+w.qty*w.price,0)/tq };
  }
  return { qty:0, price:rows[0].price };
}
function buyResource(i){
  const r = craft[i];
  const total = r.perItem * batchQty();
  const consumed = r.type==='Артефакт' ? total : Math.ceil(total * (1 - returnRate()/100));
  const wq = findWarehouse(r);
  const have = wq ? wq.qty : 0;
  const need = Math.max(consumed - have, 0);
  if(need > 0){
    const same = warehouse.find(w => w.type===r.type && w.tier===r.tier && w.ench===r.ench);
    if(same){ same.qty += need; if(!same.price && r.price) same.price = r.price; }
    else warehouse.push({ type:r.type, tier:r.tier, ench:r.ench, qty:need, price:r.price||0 });
    renderWarehouse();
  }
  renderCraft(); recalc();
}

/* ---------- Расчёт ---------- */
function returnRate(){ return Math.max(0, Math.min(100, Number($('set-return').value)||0)); }
function batchQty(){ return Math.max(0, Math.floor(Number($('set-qty').value)||0)); }

function recalc(){
  renderCraft();
  const qty = batchQty();
  const fee = Math.max(0, Number($('set-fee').value)||0);
  const sell = Math.max(0, Number($('set-sell').value)||0);
  let matCost = 0;
  craft.forEach(r=>{
    const total = r.perItem * qty;
    const art = r.type==='Артефакт';
    const wq = findWarehouse(r);
    const consumed = art ? total : (qty ? Math.ceil(total * (1 - returnRate()/100)) : 0);
    const price = art || wq===null ? r.price : wq.price;
    matCost += consumed * price;
  });
  const batchCost = matCost + fee*qty;
  const unitCost = qty ? batchCost/qty : 0;
  const revenue = sell*qty;
  const taxPct = ($('set-premium').checked ? 4 : 8) + ($('set-order').checked ? 2.5 : 0);
  const taxAmount = revenue * taxPct/100;
  const netRevenue = revenue - taxAmount;
  const profit = netRevenue - batchCost;
  const margin = netRevenue > 0 ? profit/netRevenue*100 : 0;

  const name = $('it-name').value.trim();
  let line = '';
  if(name){
    line = '<div class="itemline">'+name+' <span class="pos-badge" style="background:'+TIER_COLORS[+$('it-tier').value]+'">T'+$('it-tier').value+'</span>'
         + (+$('it-ench').value ? enchBadge(+$('it-ench').value) : '')+'</div>';
  }
  $('results').innerHTML = line
    + '<div class="res"><div class="t">Себестоимость 1 шт.</div><div class="v">'+fmt(unitCost)+'</div></div>'
    + '<div class="res"><div class="t">Себестоимость партии</div><div class="v">'+fmt(batchCost)+'</div></div>'
    + '<div class="res"><div class="t">Налог с продажи ('+taxPct+'%)</div><div class="v red">'+fmt(taxAmount)+'</div></div>'
    + '<div class="res"><div class="t">Выручка после налога</div><div class="v">'+fmt(netRevenue)+'</div></div>'
    + '<div class="res"><div class="t">Прибыль (за партию)</div><div class="v '+(profit>=0?'green':'red')+'">'+fmt(profit)+'</div></div>'
    + '<div class="res"><div class="t">Маржа</div><div class="v '+(margin>=0?'green':'red')+'">'+fmt1(margin)+'%</div></div>';
}

/* ---------- Крафт: списание со склада ---------- */
function setCraftMsg(text, ok){
  const m = $('craft-msg');
  m.textContent = text;
  m.className = 'craft-msg ' + (ok ? 'ok' : 'bad');
}
$('do-craft').onclick = () => {
  const qty = batchQty();
  if(!qty){ setCraftMsg('Укажите количество предметов.', false); return; }
  if(!craft.length){ setCraftMsg('Сначала добавьте ресурсы для крафта.', false); return; }
  const consumedOf = r => {
    const total = r.perItem * qty;
    return r.type==='Артефакт' ? total : Math.ceil(total * (1 - returnRate()/100));
  };
  const shortages = craft.filter(r => r.type!=='Артефакт' && consumedOf(r) > findWarehouse(r).qty)
                         .map(r => resName(r) + ': не хватает ' + fmt(consumedOf(r) - findWarehouse(r).qty) + ' шт.');
  if(shortages.length){
    setCraftMsg('Крафт не выполнен. ' + shortages.join('; ') + ' — нажмите «Докупить» в строке ресурса.', false);
    return;
  }
  const spent = [];
  craft.forEach(r => {
    if(r.type==='Артефакт'){ spent.push(resName(r) + ' — ' + fmt(consumedOf(r)) + ' шт. (не со склада)'); return; }
    let left = consumedOf(r);
    warehouse.forEach(w => {
      if(w.type===r.type && w.tier===r.tier && w.ench===r.ench && left > 0){
        const take = Math.min(w.qty, left);
        w.qty -= take; left -= take;
      }
    });
    spent.push(resName(r) + ' — ' + fmt(consumedOf(r)) + ' шт.');
  });
  renderWarehouse(); renderCraft(); recalc();
  setCraftMsg('Списано со склада: ' + spent.join(', '), true);
};

/* ---------- Инициализация ---------- */
fillSelect($('wh-type'), RES_TYPES.slice(0,4));
fillSelect($('wh-tier'), [4,5,6,7,8], ['T4','T5','T6','T7','T8']);
fillSelect($('wh-ench'), [0,1,2,3,4], ['нет','.1','.2','.3','.4']);
fillSelect($('cr-type'), RES_TYPES, ['Слиток','Кожа','Ткань','Брусья','Артефакт (без возврата)']);
fillSelect($('cr-tier'), [4,5,6,7,8], ['T4','T5','T6','T7','T8']);
fillSelect($('cr-ench'), [0,1,2,3,4], ['нет','.1','.2','.3','.4']);
fillSelect($('it-tier'), [4,5,6,7,8], ['T4','T5','T6','T7','T8']);
fillSelect($('it-ench'), [0,1,2,3,4], ['нет','.1','.2','.3','.4']);

['set-return','set-fee','set-qty','set-sell','set-premium','set-order'].forEach(id => $(id).addEventListener('input', recalc));
['it-name','it-tier','it-ench'].forEach(id => $(id).addEventListener('input', recalc));

renderWarehouse();
recalc();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
